        <text x="25" y="34" class="font-sans badge-text" font-size="12" fill="#64748b">CANLI SAAT</text>
        <text x="25" y="58" class="font-sans" font-size="24" font-weight="800" fill="#38bdf8">08:45:12</text>
      </g>
    </g>

    <!-- Main Content Area Mockup -->
