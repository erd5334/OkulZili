          <rect width="330" height="52" rx="10" fill="#1e293b" />
          <circle cx="20" cy="26" r="6" fill="#64748b" />
          <text x="35" y="25" class="font-sans badge-text" font-size="14" fill="#cbd5e1">1. Ders Çıkış Zili</text>
          <text x="35" y="42" class="font-sans" font-size="12" fill="#64748b">Melodi: Cikis_Zili.mp3</text>
          <text x="260" y="33" class="font-sans" font-size="16" font-weight="600" fill="#94a3b8">09:10</text>
        </g>
        <!-- Row 3 -->
        <g transform="translate(0, 120)">
          <rect width="330" height="52" rx="10" fill="#1e293b" />
          <circle cx="20" cy="26" r="6" fill="#64748b" />
          <text x="35" y="25" class="font-sans badge-text" font-size="14" fill="#cbd5e1">2. Ders Giriş Zili</text>
          <text x="35" y="42" class="font-sans" font-size="12" fill="#64748b">Melodi: Giris_Zili.mp3</text>
          <text x="260" y="33" class="font-sans" font-size="16" font-weight="600" fill="#94a3b8">09:25</text>
        </g>
        <!-- Row 4 -->
        <g transform="translate(0, 180)">
          <rect width="330" height="52" rx="10" fill="#1e293b" />
          <circle cx="20" cy="26" r="6" fill="#64748b" />
          <text x="35" y="25" class="font-sans badge-text" font-size="14" fill="#cbd5e1">2. Ders Çıkış Zili</text>
          <text x="35" y="42" class="font-sans" font-size="12" fill="#64748b">Melodi: Cikis_Zili.mp3</text>
          <text x="260" y="33" class="font-sans" font-size="16" font-weight="600" fill="#94a3b8">10:05</text>
        </g>
        <!-- Row 5 -->
        <g transform="translate(0, 240)">
          <rect width="330" height="52" rx="10" fill="#1e293b" />
          <circle cx="20" cy="26" r="6" fill="#64748b" />
          <text x="35" y="25" class="font-sans badge-text" font-size="14" fill="#cbd5e1">3. Ders Giriş Zili</text>
          <text x="35" y="42" class="font-sans" font-size="12" fill="#64748b">Melodi: Giris_Zili.mp3</text>
          <text x="260" y="33" class="font-sans" font-size="16" font-weight="600" fill="#94a3b8">10:20</text>
        </g>
        <!-- Row 6 -->
        <g transform="translate(0, 300)">
