      <circle cx="49" cy="35" r="13" fill="#be123c" />
      <polygon points="56,35 59,32 63,33 60,36 61,40 58,38 54,40 56,36 53,33 57,32" fill="#ffffff" transform="scale(0.8) translate(18,5)" />
      <text x="80" y="42" class="font-sans hero-title" font-size="18" fill="#ffffff">Tören Paneli</text>

      <g transform="translate(20, 95)">
