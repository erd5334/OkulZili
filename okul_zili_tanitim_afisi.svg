      <!-- Bell Schedule Table -->
      <rect width="360" height="470" rx="16" fill="#0f172a" stroke="#1e293b" />
      <text x="20" y="35" class="font-sans card-title" font-size="16" fill="#ffffff">Günlük Ders Programı</text>

      <!-- Schedule rows -->
