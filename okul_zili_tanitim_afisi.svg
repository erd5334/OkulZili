        <!-- Row 1 (Current Active) -->
        <g transform="translate(0, 0)">
          <rect width="330" height="52" rx="10" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" />
          <circle cx="20" cy="26" r="6" fill="#38bdf8" />
          <text x="35" y="25" class="font-sans badge-text" font-size="14" fill="#ffffff">1. Ders Giriş Zili</text>
          <text x="35" y="42" class="font-sans" font-size="12" fill="#93c5fd">Melodi: Ogretmen_Zili.mp3</text>
          <text x="260" y="33" class="font-sans" font-size="16" font-weight="700" fill="#38bdf8">08:30</text>
        </g>
        <!-- Row 2 -->
