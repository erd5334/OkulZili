    <!-- Main Window Frame (Interactive Smartboard Look) -->
    <rect width="880" height="580" rx="24" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Window Top Header -->
    <path d="M 0 24 C 0 10.7 10.7 0 24 0 L 856 0 C 869.3 0 880 10.7 880 24 L 880 60 L 0 60 Z" fill="#1e293b" />
    <circle cx="35" cy="30" r="7" fill="#ef4444" />
    <circle cx="60" cy="30" r="7" fill="#f59e0b" />
    <circle cx="85" cy="30" r="7" fill="#10b981" />
    <text x="120" y="36" class="font-sans badge-text" font-size="16" fill="#cbd5e1">Er Yazılım • Okul Zil Sistemi v2.7.0 (MEB Modu)</text>
    <rect x="730" y="15" width="130" height="30" rx="15" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <circle cx="745" cy="30" r="4" fill="#10b981" />
    <text x="758" y="35" class="font-sans badge-text" font-size="13" fill="#10b981">SİSTEM AKTİF</text>

    <!-- Sidebar Navigation Mockup -->
    <g transform="translate(20, 80)">
      <rect width="200" height="470" rx="16" fill="#0f172a" stroke="#1e293b" />
      <g transform="translate(15, 20)">
        <rect width="170" height="42" rx="10" fill="url(#cyanGrad)" />
        <text x="15" y="27" class="font-sans badge-text" font-size="14" fill="#ffffff">🔔 Zil Çizelgesi</text>
      </g>
      <g transform="translate(15, 75)">
        <rect width="170" height="42" rx="10" fill="#1e293b" />
        <text x="15" y="27" class="font-sans badge-text" font-size="14" fill="#94a3b8">🎙️ AI Anons Stüdyosu</text>
      </g>
      <g transform="translate(15, 130)">
        <rect width="170" height="42" rx="10" fill="#1e293b" />
        <text x="15" y="27" class="font-sans badge-text" font-size="14" fill="#94a3b8">🇹🇷 Tören &amp; İstiklal M.</text>
      </g>
      <g transform="translate(15, 185)">
        <rect width="170" height="42" rx="10" fill="#1e293b" />
        <text x="15" y="27" class="font-sans badge-text" font-size="14" fill="#94a3b8">📻 Teneffüs Radyosu</text>
      </g>
      <g transform="translate(15, 240)">
        <rect width="170" height="42" rx="10" fill="#1e293b" />
        <text x="15" y="27" class="font-sans badge-text" font-size="14" fill="#94a3b8">🔇 Sınav / Sessiz Mod</text>
      </g>
      <g transform="translate(15, 295)">
        <rect width="170" height="42" rx="10" fill="#1e293b" />
        <text x="15" y="27" class="font-sans badge-text" font-size="14" fill="#94a3b8">⚙️ Genel Ayarlar</text>
      </g>

